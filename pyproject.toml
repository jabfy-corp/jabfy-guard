[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jabfy-guard"
version = "0.1.0"
description = "Deterministic authorization for Jabfy home commands"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/jabfy_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
